
<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/Vanta-git/reo@main/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>R.E.P.O. WebGL</title>

  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #unity-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      outline: none;
      touch-action: none;
    }

    #unity-loading-bar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 5;
      transition: opacity 0.25s ease;
    }

    #unity-progress-bar-empty {
      width: 220px;
      max-width: 65%;
      height: 4px;
      background: #292929;
      overflow: hidden;
      border-radius: 0;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.15s linear;
    }

    #unity-warning {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: none;
      font-size: 13px;
    }

    #unity-warning div {
      padding: 10px 14px;
      background: #ffb020;
      color: #191400;
      border-bottom: 1px solid rgba(0, 0, 0, 0.25);
    }

    #fullscreen-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 30;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(15, 15, 18, 0.72);
      color: #fff;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fullscreen-btn:hover {
      background: rgba(40, 40, 46, 0.9);
    }

    #rotate-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(15, 15, 18, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #d7d7de;
      display: none;
      pointer-events: none;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-hint {
        display: block;
      }

      #unity-container {
        width: 100vw;
        height: min(100vh, calc(100vw * 9 / 16));
      }
    }
  </style>
</head>

<body>

  <div id="unity-container">

    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <button id="fullscreen-btn" title="Fullscreen" aria-label="Fullscreen">
      &#9974;
    </button>

  </div>

  <div id="rotate-hint">
    Rotate your device to landscape for the best experience.
  </div>

  <script src="split.js"></script>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");
    var unityInstance = null;

    function unityShowBanner(msg, type) {
      var div = document.createElement("div");
      div.textContent = msg;

      if (type == "error") {
        div.style = "background:#d92b2b;color:#fff;padding:10px;";
      } else {
        setTimeout(function () {
          if (div.parentNode) {
            warningBanner.removeChild(div);
          }

          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }, 6000);
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";
    }

    var lowEnd = false;

    try {
      var memory = navigator.deviceMemory || 8;
      var cores = navigator.hardwareConcurrency || 8;

      lowEnd =
        memory <= 4 ||
        cores <= 4 ||
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");

    } catch (error) {
      lowEnd = false;
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/1234.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/1234.data.unityweb",
      frameworkUrl: buildUrl + "/1234.framework.js.unityweb",
      codeUrl: buildUrl + "/1234.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "REPO Web",
      productName: "R.E.P.O. WebGL",
      productVersion: "1.0",
      showBanner: unityShowBanner,

      devicePixelRatio: lowEnd
        ? 0.7
        : Math.min(window.devicePixelRatio || 1, 1),

      autoSyncPersistentDataPath: true,

      errorHandler: function (error, url, line) {
        console.error(
          "Unity WebGL error: " + error + " (" + url + ":" + line + ")"
        );

        return false;
      }
    };

    function hideLoadingBar() {
      if (!loadingBar) return;

      loadingBar.style.opacity = "0";

      setTimeout(function () {
        if (loadingBar && loadingBar.parentNode) {
          loadingBar.parentNode.removeChild(loadingBar);
        }
      }, 300);
    }

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {

        progressBarFull.style.width =
          Math.round(progress * 100) + "%";

      }).then(function (instance) {

        unityInstance = instance;
        hideLoadingBar();

        try {
          canvas.focus();
        } catch (error) {}

      }).catch(function (message) {

        unityShowBanner(
          "Failed to load the game: " + message,
          "error"
        );

        console.error(message);

      });
    };

    script.onerror = function () {
      unityShowBanner(
        "Could not load the game build. Check your Build folder and loader files.",
        "error"
      );
    };

    document.body.appendChild(script);

    document.querySelector("#fullscreen-btn").addEventListener("click", function () {

      if (document.fullscreenElement) {
        document.exitFullscreen();
        return;
      }

      var request =
        container.requestFullscreen ||
        container.webkitRequestFullscreen;

      if (request) {
        request.call(container);

        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(function () {});
        }
      }

    });

    function flushSaves() {
      if (!unityInstance) return;

      try {
        unityInstance.SendMessage(
          "WebGLPersistence",
          "Flush"
        );
      } catch (error) {}
    }

    window.addEventListener("pagehide", flushSaves);
    window.addEventListener("beforeunload", flushSaves);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        flushSaves();
      }
    });

    canvas.addEventListener("click", function () {
      try {
        canvas.focus();
      } catch (error) {}
    });

  </script>

</body>
</html>
